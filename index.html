<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B75BB">
<title>برج القطن الطبي | Al-Qatin Tower Medical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<style>
:root{--blue:#1B75BB;--blue2:#29ABE2;--blue-deep:#125D96;--green:#2E9E4B;--green2:#39B54A;--ink:#12283A;--ink2:#5B7280;--paper:#F1F6FB;--card:#fff;--line:rgba(18,40,58,.12);--blue-soft:#E4F1FB;--green-soft:#E6F6EB;--amber:#C9832B;--amber-deep:#8A5A17;--amber-soft:#F7ECDA;--red:#C0392B;--red-soft:#FBE9E7;--g-blue:linear-gradient(135deg,#29ABE2,#1B75BB);--g-green:linear-gradient(135deg,#39B54A,#0E8A3E);--g-brand:linear-gradient(120deg,#1B75BB,#29ABE2 45%,#39B54A);--sh:0 12px 32px rgba(18,60,100,.10);--sh-lg:0 18px 44px rgba(18,60,100,.16)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;line-height:1.75;-webkit-tap-highlight-color:transparent;background:radial-gradient(1200px 500px at 85% -10%,rgba(41,171,226,.14),transparent 60%),radial-gradient(900px 420px at -10% 20%,rgba(57,181,74,.10),transparent 55%),var(--paper)}
h1,h2,h3{font-family:'Alexandria';line-height:1.45;margin:0}a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}::selection{background:var(--blue);color:#fff}
.container{max-width:1020px;margin-inline:auto;padding-inline:16px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.view-in{animation:fadeUp .4s ease both}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 14px 26px rgba(0,40,80,.3))}50%{filter:drop-shadow(0 22px 40px rgba(0,40,80,.5))}}
@keyframes ecg{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.4);opacity:1}80%,100%{transform:scale(1.5);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes blinkG{0%,100%{opacity:1}50%{opacity:.4}}
header.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);background:rgba(241,246,251,.85);border-bottom:1px solid var(--line)}
.head-in{height:62px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:'Alexandria';font-weight:800;font-size:15px;display:block;line-height:1.25;background:var(--g-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--ink2);font-size:10px;display:block}
.head-actions{display:flex;gap:8px}
.ic-btn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--ink);box-shadow:var(--sh)}
.ic-btn:active{transform:scale(.93)}.ic-btn.call{color:#fff;background:var(--g-blue);border:none}
.hero{margin-top:16px;border-radius:28px;position:relative;overflow:hidden;color:#fff;background:var(--g-brand);box-shadow:var(--sh-lg)}
.hero:before,.hero:after{content:'';position:absolute;border-radius:50%}
.hero:before{width:280px;height:280px;background:rgba(255,255,255,.14);top:-100px;left:-80px}
.hero:after{width:230px;height:230px;background:rgba(255,255,255,.10);bottom:-100px;right:-60px}
.hero-in{position:relative;z-index:2;display:grid;gap:20px;padding:30px 22px}
@media(min-width:900px){.hero-in{grid-template-columns:1.05fr .95fr;align-items:center;padding:44px 36px}}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 13px}
.hero h1{font-size:clamp(26px,6.4vw,46px);font-weight:800;margin:12px 0 8px}
.lead{color:rgba(255,255,255,.9);font-size:15px;max-width:48ch;margin:0 0 18px}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.hero-meta{display:flex;flex-direction:column;gap:7px;color:rgba(255,255,255,.88);font-size:13px;border-top:1px solid rgba(255,255,255,.25);padding-top:14px}
.hero-meta span{display:flex;align-items:center;gap:8px}.hero-meta svg{width:15px;height:15px;flex:none}
.trust{font-family:'Alexandria';font-weight:600;font-size:13px;color:#EAFFEF}
.hero-art{display:flex;flex-direction:column;align-items:center;gap:6px}
.hero-art .lg-wrap{animation:floaty 5s ease-in-out infinite,glow 5s ease-in-out infinite}
.sec{padding:26px 0 0}
.sec-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.sec-idx{font-family:'Alexandria';font-weight:700;font-size:12.5px;color:#fff;background:var(--g-green);border-radius:10px;padding:4px 10px;margin-top:5px;flex:none}
.sec-head h2{font-size:20px;font-weight:700}.sec-head p{color:var(--ink2);font-size:13px;margin:2px 0 0}
.today-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.today-strip::-webkit-scrollbar{display:none}
.t-chip{flex:none;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 13px;box-shadow:var(--sh)}
.t-chip:active{transform:scale(.97)}
.t-chip .avatar{width:36px;height:36px;border-radius:12px;font-size:13px}
.t-chip b{font-size:12.5px;display:block;line-height:1.3}.t-chip small{font-size:11px;display:block}
.st-now{color:var(--green);font-weight:700}.st-next{color:var(--amber-deep);font-weight:700}.st-off,.st-done{color:var(--ink2)}
.off-note{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:12px 16px;color:var(--ink2);font-size:13.5px}
.tiles{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:6px}
@media(max-width:540px){.tiles{grid-template-columns:1fr}}
.tile{border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;gap:6px;text-align:right;border:none}
.tile:active{transform:scale(.98)}
.tile h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:9px}
.tile p{font-size:12.5px;margin:0}
.tile .t-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:4px}
.tile .t-ic svg{width:22px;height:22px}
.tile-solid{background:var(--g-blue);color:#fff;box-shadow:var(--sh-lg)}
.tile-solid p{color:rgba(255,255,255,.85)}.tile-solid .t-ic{background:rgba(255,255,255,.2)}
.tile-line{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.tile-line p{color:var(--ink2)}.tile-line .t-ic{background:var(--g-green);color:#fff}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--sh)}
.led-row{display:flex;align-items:center;gap:13px;width:100%;padding:15px 16px;background:none;border:none;border-bottom:1px solid var(--line);text-align:right;color:var(--ink)}
.led-row:last-child{border-bottom:none}.led-row:active{background:var(--blue-soft)}
.led-ic{width:42px;height:42px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.led-ic.g{background:var(--green-soft);color:var(--green)}
.led-ic svg{width:20px;height:20px}
.led-row b{font-family:'Alexandria';font-size:14.5px;font-weight:600;display:block}
.led-row small{color:var(--ink2);font-size:12px;display:block}
.chev{margin-inline-start:auto;color:var(--ink2);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:16px;font-weight:700;font-size:14.5px;border:none;transition:.16s}
.btn:active{transform:scale(.97)}.btn svg{width:17px;height:17px}
.btn-primary{background:var(--g-blue);color:#fff;box-shadow:0 8px 20px rgba(27,117,187,.35)}
.btn-green{background:var(--g-green);color:#fff;box-shadow:0 8px 20px rgba(46,158,75,.3)}
.btn-soft{background:var(--blue-soft);color:var(--blue-deep)}
.btn-ghost{background:rgba(255,255,255,.85);border:1.5px solid var(--line);color:var(--ink)}
.btn-wa{background:#25D366;color:#fff}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:12px}.btn-block{width:100%}
.act-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(27,117,187,.35);background:#fff;color:var(--blue-deep);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;margin-top:8px;margin-inline-end:6px}
.act-btn svg{width:14px;height:14px}
.avatar{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:'Alexandria';font-weight:700;font-size:18px;flex:none}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap}
.badge svg{width:12px;height:12px}
.w-blue{background:var(--blue-soft);color:var(--blue-deep)}.w-green{background:var(--green-soft);color:var(--green)}
.w-amber{background:var(--amber-soft);color:var(--amber-deep)}.w-red{background:var(--red-soft);color:var(--red)}
.w-mut{background:rgba(18,40,58,.07);color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh)}
.doc-row{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.doc-row:before{content:'';position:absolute;top:0;inset-inline:0;height:3px;background:var(--g-brand)}
.doc-top{display:flex;gap:13px;align-items:center}
.doc-top b{font-family:'Alexandria';font-size:16.5px;display:block}.doc-top small{color:var(--ink2);font-size:12.5px;display:block}
.doc-sched{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;padding-top:13px;border-top:1px dashed var(--line)}
.doc-sched .ds{font-size:11.5px;background:var(--blue-soft);border-radius:9px;padding:3px 9px;color:var(--blue-deep)}
.doc-sched .ds b{font-weight:700}
.doc-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.field{margin-bottom:14px}.field label{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
.field input,.field select,.field textarea{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font:inherit;font-size:15px;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(27,117,187,.14)}
.err-in{border-color:var(--red)!important}
.f-err{color:var(--red);font-size:12px;margin-top:4px;display:none}.f-err.show{display:block}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chat-shell{display:flex;flex-direction:column;height:calc(100dvh - 62px - 100px);max-width:820px;margin-inline:auto}
.chat-head{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
.chat-av{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;position:relative;flex:none;background:#fff;box-shadow:var(--sh)}
.chat-av .on{position:absolute;bottom:-2px;inset-inline-start:-2px;width:13px;height:13px;border-radius:50%;background:var(--green2);border:2.5px solid var(--paper);animation:blinkG 2s infinite}
.chat-head b{font-family:'Alexandria';font-size:15px;display:block}
.chat-head small{color:var(--ink2);font-size:11px}
.chat-msgs{flex:1;overflow-y:auto;padding:16px 2px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:88%;padding:11px 15px;border-radius:18px;font-size:14px;animation:fadeUp .25s ease}
.msg.bot{background:var(--card);border:1px solid var(--line);border-start-start-radius:6px;align-self:flex-start;box-shadow:var(--sh)}
.msg.user{background:var(--g-blue);color:#fff;border-start-end-radius:6px;align-self:flex-end;margin-inline-start:auto;box-shadow:0 8px 18px rgba(27,117,187,.3)}
.msg .mt{display:block;font-size:10px;opacity:.6;margin-top:5px}
.mini-sched{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-top:8px;font-size:12.5px;line-height:2}
.mini-sched b{color:var(--blue-deep)}
.ref-box{background:var(--g-green);color:#fff;border-radius:14px;padding:11px 14px;margin-top:9px;font-size:12.5px;line-height:1.9;box-shadow:0 8px 20px rgba(46,158,75,.3)}
.ref-box b{color:#fff}
.tri-box{background:var(--blue-soft);border:1px solid rgba(27,117,187,.35);border-radius:12px;padding:9px 13px;margin-top:8px;font-size:12.5px;line-height:2}
.tri-box b{color:var(--blue-deep)}
.urg-box{background:var(--red-soft);border:1px solid rgba(192,57,43,.4);border-radius:12px;padding:9px 13px;margin-top:8px;font-size:12.5px;line-height:1.9;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:92%;padding:2px}
.chip{border:1.5px solid rgba(27,117,187,.4);color:var(--blue-deep);background:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:var(--sh)}
.chip:active{transform:scale(.95)}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:tp 1.1s infinite}
.typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}45%{opacity:1;transform:translateY(-4px)}}
.composer{display:flex;gap:9px;padding:11px 0 4px;border-top:1px solid var(--line)}
.composer input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:12px 18px;font:inherit;font-size:14.5px;background:#fff}
.composer input:focus{outline:none;border-color:var(--blue)}
.send-btn{width:48px;height:48px;border-radius:50%;background:var(--g-blue);color:#fff;border:none;display:grid;place-items:center;flex:none;box-shadow:0 8px 18px rgba(27,117,187,.4)}
.sheet-ov{position:fixed;inset:0;background:rgba(8,30,50,.55);z-index:80;opacity:0;transition:.25s}
.sheet-ov.show{opacity:1}
.sheet{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-radius:26px 26px 0 0;max-height:88dvh;overflow-y:auto;z-index:81;padding:10px 20px calc(30px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.3,1,.4,1)}
.sheet.show{transform:none}
.sheet-grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:4px}
.sh-sub{color:var(--ink2);font-size:13px;margin:0 0 16px}
@media(min-width:720px){.sheet{max-width:600px;margin:0 auto;border-radius:26px;bottom:24px;box-shadow:var(--sh-lg)}}
body.sheet-open{overflow:hidden}
.sheet-x{position:absolute;top:16px;inset-inline-start:16px}
#toasts{position:fixed;top:14px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:99;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-size:13.5px;box-shadow:var(--sh-lg);animation:fadeUp .3s ease both;max-width:92vw}
.toast svg{width:16px;height:16px;flex:none}
.toast.ok svg{color:#7FC9A0}.toast.bad svg{color:#F0A08E}
.toast.out{opacity:0;transform:translateY(-14px);transition:.3s}
.bottomnav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));inset-inline:0;display:flex;justify-content:center;z-index:50;pointer-events:none}
.bottomnav .bar{pointer-events:auto;display:flex;align-items:flex-end;gap:2px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:999px;padding:7px 12px;box-shadow:var(--sh-lg)}
.bn{width:62px;height:52px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);font-size:10.5px;font-weight:700;position:relative;border-radius:999px;transition:.15s}
.bn svg{width:21px;height:21px}
.bn.active{color:#fff;background:var(--g-blue);box-shadow:0 6px 16px rgba(27,117,187,.35)}
.bn-visit{width:60px;height:60px;border-radius:50%;background:var(--g-green);color:#fff;border:3px solid var(--paper);display:grid;place-items:center;margin-top:-26px;box-shadow:0 10px 24px rgba(46,158,75,.45)}
.bn-visit:active{transform:scale(.93)}.bn-visit svg{width:25px;height:25px}
.bn-visit-lb{position:absolute;bottom:-17px;font-size:10px;color:var(--green);font-weight:700}
details.faq{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--sh)}
details.faq summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 16px;font-weight:600;font-size:14.5px;cursor:pointer}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary .chev{transition:.25s}
details.faq[open] summary .chev{transform:rotate(180deg)}
.faq-a{padding:12px 16px 15px;color:var(--ink2);font-size:13.5px;border-top:1px dashed var(--line)}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
table.hours{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
table.hours th,table.hours td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.hours thead th{font-family:'Alexandria';font-size:12.5px;color:#fff;background:var(--g-blue)}
table.hours td.day-n{font-weight:700;font-family:'Alexandria'}
table.hours tr.today{background:var(--amber-soft)}
table.hours .mut{color:var(--ink2)}
.fri-note{display:flex;gap:9px;align-items:center;background:var(--green-soft);color:var(--green);border-radius:14px;padding:11px 15px;font-size:13px;font-weight:600;margin-top:12px}
.gate{max-width:380px;margin:40px auto;text-align:center}
.g-ic{width:74px;height:74px;border-radius:24px;background:var(--g-blue);color:#fff;display:grid;place-items:center;margin:0 auto 16px;box-shadow:var(--sh-lg)}
.g-ic svg{width:32px;height:32px}
.adm-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tab{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink2)}
.adm-tab.active{background:var(--g-blue);color:#fff;border-color:transparent}
.adm-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px;flex-wrap:wrap;box-shadow:var(--sh)}
.adm-row .grow{flex:1;min-width:140px}
.adm-row b{font-size:13.5px;display:block}.adm-row small{color:var(--ink2);font-size:11.5px;display:block}
.mini-btn{width:36px;height:36px;border-radius:11px;border:none;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.mini-btn:active{transform:scale(.92)}.mini-btn svg{width:15px;height:15px}
.mini-btn.danger{color:var(--red);background:var(--red-soft)}
.day-ed{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fff}
.de-head{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px}
.de-body{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.de-body input[type=time]{width:104px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:12px;background:var(--paper)}
.de-sess{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--ink2)}
.tel-row{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:11px;box-shadow:var(--sh);flex-wrap:wrap}

 var now=new Date(),cur=now.getHours()*60+now.getMinutes(),conf=doc.schedule[now.getDay()]||[];
 if(!conf.length)return{st:'off',text:'راحة اليوم'};
 var i,s;
 for(i=0;i<conf.length;i++){s=conf[i];
  if(cur<tmin(s.from))return{st:'next',text:'يبدأ '+fmtTime(s.from)};
  if(cur>=tmin(s.from)&&cur<tmin(s.to))return{st:'now',text:'العيادة الآن'}}
 return{st:'done',text:'انتهى دوامه اليوم'}}

 var off=[],i,j;
 for(i=0;i<7;i++){if(!(doc.schedule[i]||[]).length)off.push(i)}
 var working=7-off.length;
 if(!working)return 'لا يوجد دوام مسجّل';
 var hasM=false,hasE=false;
 for(i=0;i<7;i++){var c=doc.schedule[i]||[];for(j=0;j<c.length;j++){if(c[j].kind==='m')hasM=true;else hasE=true}}
 var sess=(hasM&&hasE)?'صباحًا ومساءً':(hasM?'صباحًا':'مساءً');
 if(working===1)return DAY_NAMES[off[0]]+' '+sess;
 if(working===6&&off[0]===5)return 'يوميًا '+sess+' — والجمعة راحة';

function normalize(s){

function lev(a,b){
 if(Math.abs(a.length-b.length)>2)return 99;
 var m=a.length,n=b.length,i,j,dp=[],r;
 for(i=0;i<=m;i++){r=[i];for(j=1;j<=n;j++)r[j]=0;dp.push(r)}
 for(j=0;j<=n;j++)dp[0][j]=j;
 for(i=1;i<=m;i++)for(j=1;j<=n;j++){dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+((a.charAt(i-1)===b.charAt(j-1))?0:1))}
 return dp[m][n]}

function buildSystemPrompt(){
 var docs=db.doctors.map(function(d){return '• id: '+d.id+' | الاسم: '+d.name+' | التخصص: '+d.specialty+' | الدوام: '+schedSummary(d)}).join('\n');

 'رابط الموقع الرسمي على خرائط قوقل (وجّه المرضى إليه): '+db.clinic.mapUrl,
 'قائمة أطبائنا (استخدم المعرف id حرفيًا في وسم التحويل):',
 docs,
 'قواعد صارمة:',
 '1) جاوب بالعربية بأسلوب ودود ومختصر (خمسة أسطر تقريبًا).',
 '2) السلامة أولًا: إذا كانت الأعراض قد تكون طارئة فابدأ بتحذير واضح بالتوجه للطوارئ فورًا.',
 '3) لا تصرف وصفة ولا جرعات أدوية دقيقة؛ الإرشاد العام فقط، وشجع على الكشف عند الحاجة.',
 '4) مهم جدًا: لا يوجد حجز إلكتروني. الكشف بالحضور المباشر في أوقات الدوام، والاستفسار هاتفيًا على الأرقام أعلاه، والموقع على الخريطة من الرابط أعلاه. لا تدعُ المريض لأي حجز، بل ادعه للزيارة المباشرة أو الاتصال.',
 '5) لا تخترع معلومات عن العيادة؛ اعتمد فقط على المعطيات أعلاه، وللأسعار حوّلهم للاستقبال هاتفيًا.',
 '6) قاعدة إلزامية: أنهِ كل رد بسطر واحد فقط بالصيغة: <<تحويل:معرف-الطبيب>> حيث تختار الطبيب الأنسب لتخصص الحالة (طفل → dr-samia، نساء وحمل → dr-amani، جلد وبشرة وشعر → dr-fatima، عظام وظهر ومفاصل → dr-mohammed، شد عضلي وتأهيل → dr-walid، والإرشاد العام → dr-mohsen). لا تكتب أي شيء بعد هذا السطر.'
 ].join('\n')}
function buildChatMessages(q){
 var msgs=[{role:'system',content:buildSystemPrompt()}];
 chatMsgs.slice(-8).forEach(function(m){
  var t=String(m.h||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,300);
  if(!t)return;
  msgs.push({role:(m.r==='u'?'user':'assistant'),content:t})});
 msgs.push({role:'user',content:q});
 return msgs}
function fetchTimeout(url,opts,ms){
 opts=opts||{};
 if(window.AbortController){
  var ctrl=new AbortController();opts.signal=ctrl.signal;
  setTimeout(function(){try{ctrl.abort()}catch(e){}},ms||30000)}
 return fetch(url,opts)}
function callOpenAIShape(url,headers,model,messages){
 return fetchTimeout(url,{method:'POST',headers:headers,
  body:JSON.stringify({model:model,messages:messages,temperature:0.6,max_tokens:700})})
 .then(function(r){
  return r.text().then(function(t){
   if(!r.ok){
    var rs='';try{var j=JSON.parse(t);rs=(j.error&&j.error.message)?j.error.message.slice(0,120):t.slice(0,120)}catch(e){rs=t.slice(0,120)}
    throw new Error('HTTP '+r.status+' — '+rs)}
   try{var jj=JSON.parse(t);
    var txt=(jj.choices&&jj.choices[0]&&jj.choices[0].message&&jj.choices[0].message.content)||'';
    if(!txt)throw new Error('رد فارغ');
    return txt}
   catch(e){if(e.message==='رد فارغ')throw e;
    throw new Error('صيغة غير متوقعة')}})})}
function callOpenEngine(messages,model){
 var sys=messages.filter(function(m){return m.role==='system'}).map(function(m){return m.content}).join('\n');
 var conv=messages.filter(function(m){return m.role!=='system'}).map(function(m){return (m.role==='user'?'المريض: ':'نور: ')+m.content}).join('\n');
 var full=sys+'\n\n---\n'+conv+'\n\nنور:';
 return fetchTimeout('https://text.pollinations.ai/'+encodeURIComponent(full)+'?model='+encodeURIComponent(model),{method:'GET'})
 .then(function(r){
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.text()})
 .then(function(t){
  var txt=String(t||'').trim();
  if(!txt||txt.length<3)throw new Error('رد فارغ');
  return txt})
 .catch(function(){
  return fetchTimeout('https://text.pollinations.ai/',{method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({messages:messages,model:model,seed:Math.floor(Math.random()*1e6)})})
  .then(function(r){
   if(!r.ok)throw new Error('HTTP '+r.status);
   return r.text()})
  .then(function(t){
   var txt=String(t||'').trim();
   try{
    var j=JSON.parse(txt);
    if(typeof j==='string')txt=j;
    else if(j&&j.choices&&j.choices[0]&&j.choices[0].message)txt=j.choices[0].message.content||''}
   catch(e){}
   txt=String(txt||'').trim();
   if(!txt)throw new Error('رد فارغ');
   return txt})})}
function callGroq(key,messages){
 return callOpenAIShape('https://api.groq.com/openai/v1/chat/completions',
  {'Content-Type':'application/json','Authorization':'Bearer '+key},
  'llama-3.3-70b-versatile',messages)}
function callOpenRouter(key,messages){
 return callOpenAIShape('https://openrouter.ai/api/v1/chat/completions',
  {'Content-Type':'application/json','Authorization':'Bearer '+key,'HTTP-Referer':(location.origin||'https://bq.local'),'X-Title':'Al-Qatin Tower Medical'},
  'meta-llama/llama-3.2-3b-instruct:free',messages)}
function callGemini(key,messages){
 var prompt=messages.map(function(m){return m.content}).join('\n\n');
 var url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent';
 return fetchTimeout(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
  body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.6,maxOutputTokens:900}})})
 .then(function(r){
  return r.text().then(function(t){
   if(!r.ok){
    var rs='';try{var j=JSON.parse(t);rs=(j.error&&j.error.message)?j.error.message.slice(0,120):t.slice(0,120)}catch(e){rs=t.slice(0,120)}
    throw new Error('HTTP '+r.status+' — '+rs)}
   try{var jj=JSON.parse(t);
    var txt='',parts=(jj.candidates&&jj.candidates[0]&&jj.candidates[0].content&&jj.candidates[0].content.parts)||[];
    parts.forEach(function(p){if(p.text)txt+=p.text});
    if(!txt)throw new Error('رد فارغ');
    return txt}
   catch(e){if(e.message==='رد فارغ')throw e;
    throw new Error('صيغة غير متوقعة')}})})}
function callChain(messages,onStep){
 var attempts=[];
 ['openai','mistral','llama'].forEach(function(m){attempts.push({name:'المصدر المفتوح ('+m+')',fn:function(){return callOpenEngine(messages,m)}})});
 if(db.ai.groqKey&&db.ai.groqKey.length>10)attempts.push({name:'المصدر الاحتياطي ١',fn:function(){return callGroq(db.ai.groqKey,messages)}});
 if(db.ai.openrouterKey&&db.ai.openrouterKey.length>10)attempts.push({name:'المصدر الاحتياطي ٢',fn:function(){return callOpenRouter(db.ai.openrouterKey,messages)}});
 if(db.ai.geminiKey&&db.ai.geminiKey.length>10)attempts.push({name:'المصدر الاحتياطي ٣',fn:function(){return callGemini(db.ai.geminiKey,messages)}});
 var i=0;
 function attempt(){
  if(i>=attempts.length){
   return Promise.reject(new Error('استُنفدت المحاولات'))}
  var a=attempts[i++];
  if(onStep)onStep('⏳ تجربة: '+a.name);
  return a.fn().then(function(txt){
   if(onStep)onStep('✅ نجح: '+a.name);
   return{txt:txt}})
  .catch(function(e){
   if(onStep)onStep('↪️ انتقال — السبب: '+String(e.message||e).slice(0,80));
   return attempt()})}
 return attempt()}
function aiToHTML(txt){
 var dr=null,m=txt.match(/<<\s*تحويل\s*:\s*([a-zA-Z0-9\-]+)\s*>>/);
 if(m)dr=m[1];
 txt=txt.replace(/<<[\s\S]*?>>/g,'').trim();
 if(!txt)return{html:'',docId:dr};
 txt=esc(txt).replace(/\n/g,'<br>');
 txt=txt.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
 return{html:txt,docId:dr}}
function showTyping(){
 var box=$('#chat-msgs');if(!box)return;
 box.insertAdjacentHTML('beforeend','<div class="msg bot typing" id="tp"><span></span><span></span><span></span></div>');
 box.scrollTop=box.scrollHeight}
function hideTyping(){var tp=$('#tp');if(tp)tp.remove()}
function aiRespond(text){
 showTyping();
 var msgs=buildChatMessages(text);
 callChain(msgs,null)
 .then(function(res){
  hideTyping();
  var p=aiToHTML(res.txt);
  if(!p.html)throw new Error('رد فارغ');
  var doc=(p.docId&&getDoc(p.docId))||referralDoc(normalize(text));
  chatMsgs.push({r:'b',h:p.html+referralHTML(doc),
   chips:['مواعيد الدوام','موقعنا','اتصل بنا'],
   acts:referralActs(),t:Date.now()});
  saveChat();appendMsgs()})
 .catch(function(){
  hideTyping();
  var r=handleInput(text,null);
  botSay(r)})}
/* ---------- تدفق الاستقصاء ---------- */
function flowStep(value,raw){
 var f=chatState.flow,n=normalize(raw||'');
 if(f.type==='case'){
  if(f.step==='symptom'){
   f.data.symptom=(raw||'').slice(0,80);f.step='step';saveChat();
   var q=detectQuals(n);
   if(q.dur)f.data.dur=q.dur;if(q.sev)f.data.sev=q.sev;if(q.age)f.data.age=q.age;if(q.comp)f.data.comp=q.comp;
   return caseReply(raw,f.data.cond,n)}
  var q2=detectQuals(n);
  if(f.data.dur===null){f.data.dur=q2.dur||raw.slice(0,30);saveChat();return caseReplyStep(f,n)}
  if(f.data.sev===null){f.data.sev=q2.sev||raw.slice(0,30);saveChat();return caseReplyStep(f,n)}
  if(f.data.age===null){f.data.age=q2.age||raw.slice(0,30);saveChat();return caseReplyStep(f,n)}
  if(f.data.comp===null){f.data.comp=q2.comp||raw.slice(0,30);f.data.extra=raw.slice(0,60);saveChat();return caseReplyStep(f,n)}
  return caseReport(f)}
 return null}

/* ---------- العقل المركزي ---------- */
function handleInput(value,raw){
 var txt=(raw!=null?raw:value)||'',n=normalize(txt);
 if(chatState.flow&&/(الغاء|الغي|توقف|كنسل)/.test(n)){chatState.flow=null;saveChat();
  return bot('تم إلغاء العملية. كيف أخدمك؟',DEFAULT_CHIPS())}
 if(chatState.flow){var fr=flowStep(value,txt);if(fr)return fr}
 if(value==='triage'){chatState.flow={type:'case',step:'symptom',data:{symptom:null,cond:null,dur:null,sev:null,age:null,comp:null,extra:null}};saveChat();
  return bot('أهلًا — خلينا نأخذ استقصاء سريع لأعراضك.<br><b>ما هو العرض الرئيسي</b> الذي تشعر به؟ اكتبه بحرية.')}
 if(isEmergency(n))return emergencyReply();
 var best=null,bs=0,i,s;
 for(i=0;i<INTENTS.length;i++){s=matchScore(n,INTENTS[i].k);if(s>bs){bs=s;best=INTENTS[i]}}
 var doc=detectDoctor(n),faq=faqMatch(n);
 if(doc&&bs<2&&(!faq||faq.score<2))return replyDoctor(doc);
 if(best&&bs>=1){var r=best.fn(n);if(r)return r}
 if(faq){var fdoc=referralDoc(n);
  return bot('<b>'+esc(faq.f.q)+'</b><br>'+esc(faq.f.a)+referralHTML(fdoc),['مواعيد الدوام','موقعنا'],referralActs())}
 var mBest=null,mS=0;
 for(i=0;i<MED_KB.length;i++){s=matchScore(n,MED_KB[i].k);if(s>mS){mS=s;mBest=MED_KB[i]}}
 if(mBest&&mS>=1){
  startCase(raw,mBest);
  return caseReply(raw,mBest,n)}
 var isMed=MED_HINTS.some(function(w){return n.indexOf(w)>-1});
 if(isMed||n.length>6){
  startCase(raw,null);

function renderChat(){

 $('#view').innerHTML='<div class="container" style="max-width:820px"><div class="chat-shell">'+
 '<div class="chat-head"><span class="chat-av">'+LOGO(34)+'<span class="on"></span></span>'+
 '<div style="flex:1"><b>نور — المساعد الذكي</b><small>يرد على جميع الأسئلة · متاح ٢٤ ساعة</small></div>'+
 '<button class="mini-btn" data-action="chat-clear" title="محادثة جديدة"><i data-lucide="rotate-ccw"></i></button></div>'+
 '<div class="chat-msgs" id="chat-msgs"></div>'+
 '<div class="composer"><input id="chat-input" placeholder="اسأل أي شيء طبي: صداع، مغص، حرارة…" autocomplete="off">'+
 '<button class="send-btn" data-action="chat-send" aria-label="إرسال"><i data-lucide="send" class="i-flip"></i></button></div></div></div>';
 appendMsgs();

 inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendChat()}});

function renderMsg(m){
 var d=new Date(m.t||Date.now()),ts=pad(d.getHours())+':'+pad(d.getMinutes());
 var h='<div class="msg '+(m.r==='u'?'user':'bot')+'">'+(m.h||'')+'<span class="mt">'+ts+'</span></div>';
 if(m.chips&&m.chips.length)h+='<div class="chips">'+m.chips.map(function(c){
  return '<button class="chip" data-action="chat-chip" data-v="'+esc(c.value||c.label)+'" data-label="'+esc(c.label)+'">'+esc(c.label)+'</button>'}).join('')+'</div>';
 if(m.acts&&m.acts.length)h+='<div class="chips">'+m.acts.map(function(a){
  var attrs=Object.keys(a.data||{}).map(function(k){return 'data-'+k+'="'+esc(a.data[k])+'"'}).join(' ');
  return '<button class="act-btn" data-action="'+a.act+'" '+attrs+'><i data-lucide="'+a.icon+'"></i>'+esc(a.label)+'</button>'}).join('')+'</div>';
 return h}
function appendMsgs(){
 var box=$('#chat-msgs');if(!box)return;
 box.innerHTML=chatMsgs.map(renderMsg).join('');icons();box.scrollTop=box.scrollHeight}
function pushUser(html){chatMsgs.push({r:'u',h:html,t:Date.now()});saveChat();appendMsgs()}
function botSay(payload){
 var box=$('#chat-msgs');if(!box){chatMsgs.push({r:'b',h:payload.html,chips:payload.chips,acts:payload.acts,t:Date.now()});saveChat();return}
 showTyping();
 setTimeout(function(){
  hideTyping();
  chatMsgs.push({r:'b',h:payload.html,chips:payload.chips,acts:payload.acts,t:Date.now()});
  saveChat();appendMsgs()},Math.min(400+String(payload.html||'').length*4,1400))}
function sendChat(){

 inp.value='';pushUser(esc(v));
 if(db.ai.enabled){aiRespond(v)}else{botSay(handleInput(v,null))}}
